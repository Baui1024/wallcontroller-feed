# TLS termination for the gpio-daemon websocket: clients connect to
# wss://<device>:8765, nginx forwards to the daemon on localhost as plain ws.
# Certificate is shared with the web UI, see /usr/bin/cert-renew.sh
server {
	listen 8765 ssl;
	listen [::]:8765 ssl;
	server_name _gpio_daemon_ws;
	include restrict_locally;

	ssl_certificate /etc/wallcontroller/tls/server.crt;
	ssl_certificate_key /etc/wallcontroller/tls/server.key;
	access_log off;

	location / {
		proxy_pass http://127.0.0.1:8766;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_buffering off;
		# Control connections stay open for a long time; websockets pings every 20s
		proxy_read_timeout 1h;
		proxy_send_timeout 1h;
	}
}
